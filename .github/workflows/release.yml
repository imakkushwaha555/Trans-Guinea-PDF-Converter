name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"
          choco install innosetup --no-progress --yes

      - name: Build executable and installer
        shell: pwsh
        run: .\packaging\build_windows.ps1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Trans-Guinea-PDF-Converter-Setup-0.1.1.exe
            release/Trans-Guinea-PDF-Converter-0.1.1-portable.zip
            release/SHA256SUMS.txt

  macos-release:
    strategy:
      matrix:
        os: [macos-13, macos-14]  # Intel and Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build app and dmg
        run: bash packaging/build_macos.sh

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/SHA256SUMS-macos-*.txt
