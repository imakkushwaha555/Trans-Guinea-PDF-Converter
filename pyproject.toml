[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trans-guinea-pdf-converter"
version = "0.1.2"
description = "Free, open-source offline PDF tools: convert PDF to Word or Excel, merge PDFs and split PDFs by page. Private, local processing."
keywords = ["pdf-converter", "pdf-to-word", "pdf-to-excel", "merge-pdf", "split-pdf", "pdf2docx", "document-converter", "offline", "privacy", "windows"]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "IMakKushwaha" }]
maintainers = [{ name = "IMakKushwaha" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "Flask>=3.1,<4",
    "pdf2docx>=0.5.8",
    "pdfplumber>=0.11,<1",
    "pypdf>=5,<7",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
    "pywebview>=5.3,<7",
]

[project.urls]
Homepage = "https://github.com/imakkushwaha555/Trans-Guinea-PDF-Converter"
Issues = "https://github.com/imakkushwaha555/Trans-Guinea-PDF-Converter/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
trans-guinea-pdf-converter = "run:main"

[tool.pytest.ini_options]
testpaths = ["test_app.py"]
addopts = "-q"

[tool.setuptools]
py-modules = ["app", "run", "pdf_common", "help_content"]
packages = ["tools"]